<style>
  :root {
    --bg: #F6F4EC;
    --card-bg: #FFFFFF;
    --card-border: #E4DFD1;
    --text-heading: #2A2E26;
    --text-body: #3D4136;
    --text-muted: #676D5C;
    --accent: #146B4A;
    --accent-hover: #0D5338;
    --accent-soft: #DCE8DB;
    --bark-light: #8FA885;
    --font-heading: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --shadow-md: 0 6px 16px rgba(43,38,32,0.08), 0 2px 4px rgba(43,38,32,0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }
  .blob {
    position: absolute;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--accent-soft), transparent 70%);
    top: -160px; right: -140px;
    pointer-events: none;
    opacity: .85;
  }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    box-shadow: var(--shadow-md);
    max-width: 34rem;
    width: 100%;
    padding: 40px 36px;
    text-align: center;
  }
  .logo { height: 52px; width: auto; margin-bottom: 18px; }
  .badge {
    display: inline-block;
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: var(--font-heading);
    font-weight: 700;
    color: var(--text-heading);
    font-size: 1.85rem;
    line-height: 1.2;
    margin: 0 0 14px;
  }
  p { margin: 0 0 18px; font-size: 1rem; }
  .cta {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 999px;
    transition: background 150ms cubic-bezier(.4,0,.2,1);
  }
  .cta:hover { background: var(--accent-hover); }
  .muted {
    font-size: .8125rem;
    color: var(--text-muted);
    margin: 22px 0 0;
  }
  .rule {
    border: 0;
    border-top: 1px solid var(--card-border);
    margin: 26px 0 0;
  }
  .sig {
    font-size: .8125rem;
    color: var(--bark-light);
    margin: 14px 0 0;
  }
  @media (max-width: 480px) {
    .card { padding: 32px 22px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="blob"></div>
  <main class="card">
    <img class="logo" src="https://suriyatiujang.com/STA334/assets/logo.png" alt="Learn R" onerror="this.style.display='none'">
    <div class="badge">STA334 &middot; Learn R</div>
    <h1>This page has moved</h1>
    <p>Course information has moved to the new STA334 course site.</p>
    <p><a class="cta" href="https://suriyatiujang.com/STA334/Syllabus.html">Continue to the Syllabus &rarr;</a></p>
    <p class="muted">Taking you there automatically. Please update your bookmarks to <strong>suriyatiujang.com/STA334/</strong></p>
    <hr class="rule">
    <p class="sig">Suriyati Ujang &middot; Introduction to Statistical Programming</p>
  </main>
</body>
</html>
